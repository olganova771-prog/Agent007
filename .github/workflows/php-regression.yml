name: PHP regression checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Schema SQL regression
        run: php tests/schema-sql-regression.php
      - name: Matrix enqueue budget regression
        run: php tests/matrix-enqueue-budget-regression.php
      - name: Post meta slashing regression
        run: php tests/post-meta-slashing-regression.php
